format: ai-skills-claim-plan
profiles:
  repository-rules:
  - kind: rule
    subject: cicd.layers.separated
    selectors:
    - '*separates read-only validation from protected publication*'
    result_files:
    - junit.xml
    execution_id: quality
  - kind: rule
    subject: cicd.workflow.least-privilege
    selectors:
    - '*grants packages write only to the publish job*'
    result_files:
    - junit.xml
    execution_id: quality
  - kind: rule
    subject: cicd.workflow.profiled
    selectors:
    - '*audits workflows with the pinned policy tool*'
    result_files:
    - junit.xml
    execution_id: quality
  - kind: rule
    subject: cicd.release.identity
    selectors:
    - '*promotes the exact tested digest without executing candidate code in publish*'
    result_files:
    - junit.xml
    execution_id: quality
  - kind: artifact
    subject: ai-skills-lock-2.0.0
    selectors:
    - '*declares adopted skills with immutable revisions and matching standard digests*'
    result_files:
    - junit.xml
    execution_id: quality
    content_path: ai-skills.lock.yaml
    commands:
    - pnpm test --reporter=default --reporter=junit --outputFile.junit=evidence/junit.xml
