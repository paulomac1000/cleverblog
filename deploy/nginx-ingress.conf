# cleverblog ingress — trusted-proxy normalization
#
# Topology: Visitor -> Cloudflare -> Cytrus (135.181.95.85) -> this nginx (VPS:40177) -> cleverblog:3000
#
# Security model (decided with ChatGPT review 2026-09-03):
# - TCP peer == 135.181.95.85 (Cytrus)  -> X-Verified-Client-IP := CF-Connecting-IP (visitor IP)
# - any other TCP peer (direct origin hit) -> X-Verified-Client-IP := actual TCP peer
#   (spoofed CF-Connecting-IP from direct access is IGNORED -> rate-limit bypass closed)
# - inbound X-Verified-Client-IP is never trusted: the header is always overwritten below
# - if Cytrus egress IP changes, site keeps working (worst case: all proxied visitors share
#   one rate-limit bucket until the geo entry is updated)

geo $trusted_proxy {
    default 0;
    135.181.95.85 1;
}

map "$trusted_proxy:$http_cf_connecting_ip" $verified_client_ip {
    ~^1:.+  $http_cf_connecting_ip;
    default $remote_addr;
}

log_format verified '$remote_addr -> verified=$verified_client_ip host=$host '
                    '"$request" $status ${msec}';

# Everything NOT addressed to cleverblog.pl is scanner/bot noise hitting the
# origin directly (xmlrpc.php probes etc.) — close without a response.
# CAUTION: if the Cloudflare origin ever changes to a different hostname
# (e.g. a Cytrus byst.re name), that hostname must be added here or the
# whole site returns connection resets.
server {
    listen 40177 default_server;
    access_log off;
    return 444;
}

server {
    listen 40177;
    server_name cleverblog.pl;

    access_log /var/log/nginx/access.log verified;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream cleverblog;

        proxy_pass http://$upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # ALWAYS overwritten -> inbound X-Verified-Client-IP can never spoof the app
        proxy_set_header X-Verified-Client-IP $verified_client_ip;
        proxy_set_header CF-Connecting-IP "";

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
