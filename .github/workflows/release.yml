name: Release
# ai-skills-policy-profile: protected-release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag; defaults to the current ref
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: cleverblog
          POSTGRES_USER: cleverblog
          POSTGRES_PASSWORD: cleverblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleverblog -d cleverblog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          TAG_SHA="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null || true)"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG does not resolve to triggering SHA $GITHUB_SHA" >&2
              exit 1
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
              echo "Manual releases must be dispatched against the exact release tag" >&2
              exit 1
            fi

            if [[ -z "$TAG_SHA" ]]; then
              echo "Release tag $RELEASE_TAG does not exist" >&2
              exit 1
            fi

            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG does not resolve to workflow SHA $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release SHA $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "${RELEASE_TAG#v}" ]]; then
            echo "package.json version $PACKAGE_VERSION does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.x
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: 24.15.0

      - name: Build application bundle
        shell: bash
        env:
          DATABASE_URL: postgres://cleverblog:cleverblog@127.0.0.1:5432/cleverblog
          PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          mkdir -p media
          pnpm payload migrate
          pnpm generate:types
          # build:prod freezes NEXT_PUBLIC_SERVER_URL=https://cleverblog.pl
          # into the artifact (Next.js build-time env) — plain `pnpm build`
          # would bake localhost into serverURL/cors/csrf/SEO.
          pnpm build:prod

      - name: Ensure media directory in build context
        run: mkdir -p media

      # Publish to a public GHCR package linked to this public repository.
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build release image once
        run: docker build -t "ghcr.io/paulomac1000/cleverblog-site:quarantine-${{ github.sha }}" .

      - name: Stage tested image in quarantine
        run: docker push "ghcr.io/paulomac1000/cleverblog-site:quarantine-${{ github.sha }}"

      - name: Resolve immutable quarantine digest
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(docker inspect \
            --format '{{index .RepoDigests 0}}' \
            "ghcr.io/paulomac1000/cleverblog-site:quarantine-${{ github.sha }}" | cut -d@ -f2)"
          [[ "$DIGEST" == sha256:* ]] || { echo "Registry did not return a sha256 digest" >&2; exit 1; }
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Smoke exact digest
        shell: bash
        run: |
          set -euo pipefail

          if ss -ltn '( sport = :3000 )' | grep -q LISTEN; then
            echo 'Port 3000 is already in use' >&2
            exit 1
          fi

          docker pull "ghcr.io/paulomac1000/cleverblog-site@${IMAGE_DIGEST}"
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgres://cleverblog:cleverblog@127.0.0.1:5432/cleverblog \
            -e PAYLOAD_SECRET=smoke-only-secret-smoke-only-secret \
            -e NEXT_PUBLIC_SERVER_URL=http://localhost:3000 \
            "ghcr.io/paulomac1000/cleverblog-site@${IMAGE_DIGEST}"

          cleanup() {
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            # /api/access is a real Payload REST endpoint that returns 200
            # regardless of database content; bare /api is 404 by design.
            code="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/access || true)"
            if [[ "$code" == '200' ]]; then
              cleanup
              trap - EXIT
              exit 0
            fi
            sleep 5
          done

          docker logs smoke || true
          echo 'Smoke test did not return HTTP 200 within 120 seconds' >&2
          exit 1

      - name: Export tested image digest
        run: printf '%s' "$IMAGE_DIGEST" > tested-image.digest

      - name: Upload tested image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-release-image
          path: tested-image.digest
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: protected-release
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download tested image digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-release-image

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Promote exact tested digest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/paulomac1000/cleverblog-site"
          IMAGE_DIGEST="$(cat tested-image.digest)"
          [[ "$IMAGE_DIGEST" == sha256:* ]] || { echo "Artifact did not contain a sha256 digest" >&2; exit 1; }
          DIGEST_REF="${IMAGE}@${IMAGE_DIGEST}"
          SHA_REF="${IMAGE}:sha-${{ github.sha }}"
          RELEASE_REF="${IMAGE}:${RELEASE_TAG}"

          expected_digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }

          for ref in "$SHA_REF" "$RELEASE_REF"; do
            if existing="$(expected_digest "$ref" 2>/dev/null)"; then
              if [[ "$existing" != "$IMAGE_DIGEST" ]]; then
                echo "Immutable tag $ref already exists with digest $existing, refusing to move it" >&2
                exit 1
              fi
            fi
          done

          # Immutable identity first, human pointer last.
          docker buildx imagetools create -t "$SHA_REF" "$DIGEST_REF"
          docker buildx imagetools create -t "$RELEASE_REF" "$DIGEST_REF"

          for ref in "$SHA_REF" "$RELEASE_REF"; do
            resolved="$(expected_digest "$ref")"
            test "$resolved" = "$IMAGE_DIGEST"
          done

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
