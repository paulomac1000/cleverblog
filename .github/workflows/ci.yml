name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://cleverblog:cleverblog@127.0.0.1:5432/cleverblog
      PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cleverblog
          POSTGRES_USER: cleverblog
          POSTGRES_PASSWORD: cleverblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleverblog -d cleverblog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm payload migrate
      - run: pnpm generate:types
      - run: pnpm build
