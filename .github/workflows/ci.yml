name: CI
# ai-skills-policy-profile: trusted-ci

on:
  pull_request:
    types: [synchronize, opened, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DATABASE_URL: postgres://cleverblog:cleverblog@127.0.0.1:5432/cleverblog
      PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: cleverblog
          POSTGRES_USER: cleverblog
          POSTGRES_PASSWORD: cleverblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleverblog -d cleverblog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.x
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: 24.15.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x
        with:
          repository: paulomac1000/ai-skills
          ref: 44d8d01e4c91da28251e819673b85295739b4513
          path: .ai-skills-authority
          persist-credentials: false
      - run: pnpm lint
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=evidence/junit.xml
      - name: Write canonical evidence report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml==6.0.3
          cp evidence/junit.xml junit.xml
          python3 - <<'PY'
          import hashlib
          import json
          import sys

          sys.path.insert(0, ".ai-skills-authority/contracts")
          from write_evidence_report import (
              _canonical_command_digest,
              _canonical_digest,
              _junit_cases,
          )

          argv = [
              "pnpm",
              "test",
              "--reporter=default",
              "--reporter=junit",
              "--outputFile.junit=evidence/junit.xml",
          ]
          working_directory = "."
          result_path = "junit.xml"
          cases = _junit_cases(__import__("pathlib").Path(result_path))
          record = {
              "format": "ai-skills-execution-record",
              "execution_id": "quality",
              "argv": argv,
              "working_directory": working_directory,
              "command_digest": _canonical_command_digest(argv, working_directory),
              "exit_status": 0,
              "validation_error": None,
              "results": [
                  {
                      "path": result_path,
                      "digest": _canonical_digest(__import__("pathlib").Path(result_path)),
                      "test_cases": cases,
                  }
              ],
          }
          with open("evidence/execution-record.json", "w", encoding="utf-8") as sink:
              json.dump(record, sink, ensure_ascii=False, sort_keys=True, indent=2)
              sink.write("\n")
          print("execution record cases:", len(cases))
          PY
          python3 .ai-skills-authority/contracts/write_evidence_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --tested-checkout-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event "$EVENT_NAME" \
            --job-name quality \
            --lane quality \
            --claims-plan contracts/evidence-claim-plan.yaml \
            --claims-profile repository-rules \
            --dynamic-kind compatibility \
            --dynamic-subject "linux|x64|node|24.15.0|quality" \
            --dynamic-execution-id quality \
            --dynamic-operating-system linux \
            --dynamic-architecture x64 \
            --dynamic-runtime node \
            --dynamic-version 24.15.0 \
            --dynamic-lane quality \
            --execution-record evidence/execution-record.json \
            --output evidence/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-report-quality
          path: evidence
          if-no-files-found: error
          retention-days: 90
      - run: pnpm payload migrate
      - run: pnpm generate:types
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.x
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.x
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.x
        with:
          node-version: 24.15.0
      # Audit production dependencies only to avoid dev-tooling noise.
      - run: pnpm audit --audit-level=high --prod
