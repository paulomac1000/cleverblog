services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cleverblog
      POSTGRES_USER: cleverblog
      POSTGRES_PASSWORD: cleverblog
    ports:
      - "5432:5432"
    volumes:
      - cleverblog-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleverblog -d cleverblog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cleverblog-postgres:
