# Production topology (decided with ChatGPT review 2026-09-03):
# Visitor -> Cloudflare -> Cytrus (135.181.95.85) -> ingress (nginx, publishes 40177)
#   -> cleverblog:3000 (internal Docker network only)
#
# ingress performs trusted-proxy IP normalization: the app must ONLY trust
# the X-Verified-Client-IP header (never raw CF-Connecting-IP), see
# deploy/nginx-ingress.conf and src/actions/submitComment.ts.
services:
  cleverblog:
    image: cleverblog:prod
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    container_name: cleverblog
    restart: unless-stopped
    environment:
      DATABASE_URL: ${CLEVERBLOG_DATABASE_URL}
      NEXT_PUBLIC_SERVER_URL: https://cleverblog.pl
      PAYLOAD_SECRET: ${CLEVERBLOG_PAYLOAD_SECRET}
      NODE_OPTIONS: --max-old-space-size=384
      # Public comment submissions. All four must be set to enable the form;
      # missing any value fails closed (approved comments stay visible).
      COMMENTS_ENABLED: ${CLEVERBLOG_COMMENTS_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${CLEVERBLOG_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${CLEVERBLOG_TURNSTILE_SECRET_KEY:-}
      COMMENT_SECURITY_SECRET: ${CLEVERBLOG_COMMENT_SECURITY_SECRET:-}
      COMMENTS_MT_ENABLED: ${CLEVERBLOG_COMMENTS_MT_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COMMENTS_MT_MODEL: ${COMMENTS_MT_MODEL:-openai/gpt-5.6-luna}
      COMMENTS_MT_FALLBACK_MODEL: ${COMMENTS_MT_FALLBACK_MODEL:-google/gemini-3.8-flash}
    expose:
      - "3000"
    volumes:
      - ./media:/app/media
    mem_limit: 480m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingress:
    # CVE-2026-42533 fixed in 1.31.3+; bumped per post-publication security review
    image: nginx:1.31.5-alpine
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    container_name: cleverblog-ingress
    restart: unless-stopped
    ports:
      - "40177:40177"
    volumes:
      - ./nginx-ingress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cleverblog
    mem_limit: 64m
