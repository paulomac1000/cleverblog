services:
  cleverblog:
    build:
      context: .
    image: cleverblog:prod
    container_name: cleverblog
    restart: unless-stopped
    ports:
      - "40176:3000"
    environment:
      DATABASE_URL: ${CLEVERBLOG_DATABASE_URL}
      NEXT_PUBLIC_SERVER_URL: https://cleverblog.pl
      PAYLOAD_SECRET: ${CLEVERBLOG_PAYLOAD_SECRET}
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 480m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
